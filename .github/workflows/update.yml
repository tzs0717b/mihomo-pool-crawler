name: Refresh tested subscription

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tested-subscription
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install Mihomo
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz \
            | gzip -d > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
      - run: python scripts/aggregate.py
      - run: python scripts/benchmark.py --mihomo /tmp/mihomo --workers 32 --timeout-ms 4500
      - name: Check subscription syntax
        run: /tmp/mihomo -t -d /tmp/mihomo-check -f clash-subscription.yaml
      - name: Commit changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes.yaml clash-subscription.yaml report.json benchmark.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "refresh tested proxy subscription"
            git push
          fi
